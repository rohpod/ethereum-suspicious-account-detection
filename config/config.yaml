seed: 42            # assumption: not specified in paper
paths:
  data_raw: data/
  results: results/
data:
  filename: transaction_dataset.csv
  label_column: FLAG
  suspicious_label: 1
  id_columns:
    - "Unnamed: 0"
    - "Index"
    - "Address"
  categorical_columns:
    - " ERC20 most sent token type"
    - " ERC20_most_rec_token_type"
cleaning:
  policy: drop_numeric_missing
  deduplicate: false
scaling:
  method: zscore
paper_reference:
  rows: 9841
  benign: 7663
  suspicious: 2178
  features_text: 49
  features_table_a2: 45
  cleaned_rows: 8990
  cleaned_benign: 7662
  cleaned_suspicious: 1328
  dropped_rows: 851
  smote_rows: 15324
  train: 12259
  test: 3065
  test_benign: 1544
  test_suspicious: 1521
models:
  xgboost:
    objective: "binary:logistic"
    subsample: 1.0
    defaults:
      n_estimators: 100
      gamma: 0.0
      min_child_weight: 1
      colsample_bytree: 1.0
      max_depth: 6
      reg_lambda: 1.0
      learning_rate: 0.3
  svm:
    kernel: "rbf"
    defaults:
      C: 0.1
      gamma: 0.1
  isolation_forest:
    defaults:
      contamination: 0.1
      max_samples: 256
      n_estimators: 100
pso:
  iterations: 50          # paper 4.2.3
  inertia_decay: 0.99     # paper Eq. 8 (alpha = 0.99)
  swarm_size: 30          # assumption: not specified in paper
  c1: 2.0                 # assumption: cognitive coefficient not specified in paper
  c2: 2.0                 # assumption: social coefficient not specified in paper
  w_initial: 0.9          # assumption: initial inertia weight not specified in paper
  seg: 10                 # assumption: SEG parameter in Eq. 7 not specified in paper
  bounds: [0.0, 1.0]      # assumption: particle position search space
  select_threshold: 0.5   # assumption: continuous position to feature selection threshold
  empty_subset_fitness: 1.0 # assumption: worst possible RMSE assigned to empty subset
  fitness:
    model: decision_tree
    cv_folds: 3
    metric: rmse_hard_labels
  use_cache: true
  table2_columns:
    - avg_min_between_received_tnx
    - time_diff_between_first_and_last_mins
    - sent_tnx
    - received_tnx
    - unique_received_from_addresses
    - unique_sent_to_addresses
    - avg_val_sent
    - total_transactions_including_tnx_to_create_contract
    - total_erc20_tnxs
    - erc20_total_ether_sent
    - erc20_min_val_sent
    - erc20_max_val_sent
    - erc20_avg_val_sent
  table2_ambiguous:
    "Unique ERC20 Sent address":
      - erc20_uniq_sent_addr
      - erc20_uniq_sent_addr_1
features:
  table2_reference:
    - avg_min_between_received_tnx
    - time_diff_between_first_and_last_mins
    - sent_tnx
    - received_tnx
    - unique_received_from_addresses
    - unique_sent_to_addresses
    - avg_val_sent
    - total_transactions_including_tnx_to_create_contract
    - total_erc20_tnxs
    - erc20_total_ether_sent
    - erc20_uniq_sent_addr
    - erc20_min_val_sent
    - erc20_max_val_sent
    - erc20_avg_val_sent
smote:
  k_neighbors: 5
  sampling_strategy: "auto"
split:
  test_size: 0.2
  shuffle: true
  stratify: false
ga:
  population: 50    # paper 4.3
  generations: 20
paper_results:
  default:   # Table 8 (without GA, test N=3065)
    xgboost:
      accuracy: 0.975
      precision: 0.97
      recall: 0.98
      f1: 0.975
      auc: 0.97
    svm:
      accuracy: 0.744
      precision: 0.826
      recall: 0.713
      f1: 0.765
      auc: 0.71
    isolation_forest:
      accuracy: 0.694
      precision: 0.732
      recall: 0.683
      f1: 0.707
      auc: 0.53

