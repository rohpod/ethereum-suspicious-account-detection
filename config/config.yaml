seed: 42            # assumption: not specified in paper
paths:
  data_raw: data/
  results: results/
data:
  filename: transaction_dataset.csv
  label_column: FLAG
  suspicious_label: 1
  id_columns:
    - "Unnamed: 0"
    - "Index"
    - "Address"
  categorical_columns:
    - " ERC20 most sent token type"
    - " ERC20_most_rec_token_type"
cleaning:
  policy: drop_numeric_missing
  deduplicate: false
scaling:
  method: zscore
paper_reference:
  rows: 9841
  benign: 7663
  suspicious: 2178
  features_text: 49
  features_table_a2: 45
  cleaned_rows: 8990
  cleaned_benign: 7662
  cleaned_suspicious: 1328
  dropped_rows: 851
models:
  xgboost:
    objective: "binary:logistic"
    subsample: 1.0
    defaults:
      n_estimators: 100
      gamma: 0.0
      min_child_weight: 1
      colsample_bytree: 1.0
      max_depth: 6
      reg_lambda: 1.0
      learning_rate: 0.3
  svm:
    kernel: "rbf"
    defaults:
      C: 0.1
      gamma: 0.1
  isolation_forest:
    defaults:
      contamination: 0.1
      max_samples: 256
      n_estimators: 100
pso:
  iterations: 50    # paper 4.2.3
  inertia_decay: 0.99
ga:
  population: 50    # paper 4.3
  generations: 20
split:
  test_size: 0.2
