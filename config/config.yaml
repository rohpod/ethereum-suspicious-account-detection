seed: 42            # assumption: not specified in paper
paths:
  data_raw: data/
  results: results/
data:
  filename: transaction_dataset.csv
  label_column: FLAG
  suspicious_label: 1
  id_columns:
    - "Unnamed: 0"
    - "Index"
    - "Address"
  categorical_columns:
    - " ERC20 most sent token type"
    - " ERC20_most_rec_token_type"
cleaning:
  policy: drop_numeric_missing
  deduplicate: false
scaling:
  method: zscore
paper_reference:
  rows: 9841
  benign: 7663
  suspicious: 2178
  features_text: 49
  features_table_a2: 45
  cleaned_rows: 8990
  cleaned_benign: 7662
  cleaned_suspicious: 1328
  dropped_rows: 851
  smote_rows: 15324
  train: 12259
  test: 3065
  test_benign: 1544
  test_suspicious: 1521
models:
  xgboost:
    objective: "binary:logistic"
    subsample: 1.0
    defaults:
      n_estimators: 100
      gamma: 0.0
      min_child_weight: 1
      colsample_bytree: 1.0
      max_depth: 6
      reg_lambda: 1.0
      learning_rate: 0.3
  svm:
    kernel: "rbf"
    defaults:
      C: 0.1
      gamma: 0.1
  isolation_forest:
    defaults:
      contamination: 0.1
      max_samples: 256
      n_estimators: 100
  cart:
    criterion: "gini"
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
  lof:
    n_neighbors: 20
    contamination: "auto"
    novelty: true
pso:
  iterations: 50          # paper 4.2.3
  inertia_decay: 0.99     # paper Eq. 8 (alpha = 0.99)
  swarm_size: 30          # assumption: not specified in paper
  c1: 2.0                 # assumption: cognitive coefficient not specified in paper
  c2: 2.0                 # assumption: social coefficient not specified in paper
  w_initial: 0.9          # assumption: initial inertia weight not specified in paper
  seg: 10                 # assumption: SEG parameter in Eq. 7 not specified in paper
  bounds: [0.0, 1.0]      # assumption: particle position search space
  select_threshold: 0.5   # assumption: continuous position to feature selection threshold
  empty_subset_fitness: 1.0 # assumption: worst possible RMSE assigned to empty subset
  fitness:
    model: decision_tree
    cv_folds: 3
    metric: rmse_hard_labels
  use_cache: true
  table2_columns:
    - avg_min_between_received_tnx
    - time_diff_between_first_and_last_mins
    - sent_tnx
    - received_tnx
    - unique_received_from_addresses
    - unique_sent_to_addresses
    - avg_val_sent
    - total_transactions_including_tnx_to_create_contract
    - total_erc20_tnxs
    - erc20_total_ether_sent
    - erc20_min_val_sent
    - erc20_max_val_sent
    - erc20_avg_val_sent
  table2_ambiguous:
    "Unique ERC20 Sent address":
      - erc20_uniq_sent_addr
      - erc20_uniq_sent_addr_1
features:
  table2_reference:
    - avg_min_between_received_tnx
    - time_diff_between_first_and_last_mins
    - sent_tnx
    - received_tnx
    - unique_received_from_addresses
    - unique_sent_to_addresses
    - avg_val_sent
    - total_transactions_including_tnx_to_create_contract
    - total_erc20_tnxs
    - erc20_total_ether_sent
    - erc20_uniq_sent_addr
    - erc20_min_val_sent
    - erc20_max_val_sent
    - erc20_avg_val_sent
smote:
  k_neighbors: 5
  sampling_strategy: "auto"
split:
  test_size: 0.2
  shuffle: true
  stratify: false
ga:
  population: 50        # paper 4.3
  generations: 20       # paper 4.3
  cxpb: 0.5             # assumption: DEAP tutorial default, not in paper
  mutpb: 0.2            # assumption: DEAP tutorial default, not in paper
  indpb: 0.2            # assumption: gene-level mutation probability
  sigma_fraction: 0.1   # assumption: Gaussian mutation sigma is 10% of gene range
  blend_alpha: 0.5      # assumption: cxBlend alpha parameter
  cv_folds: 3           # assumption: 3-fold stratified CV on train split
  metric: "accuracy"    # paper 4.3
  use_cache: true
  search_spaces:
    xgboost:
      - name: n_estimators
        type: int
        bounds: [10, 300]
      - name: gamma
        type: float
        bounds: [0.0, 5.0]
      - name: min_child_weight
        type: float
        bounds: [1.0, 10.0]
      - name: colsample_bytree
        type: float
        bounds: [0.3, 1.0]
      - name: max_depth
        type: int
        bounds: [3, 10]
      - name: reg_lambda
        type: float
        bounds: [0.0, 10.0]
      - name: learning_rate
        type: float
        bounds: [0.01, 1.0]
    svm:
      - name: C
        type: log10_float
        bounds: [-2.0, 2.0]
      - name: gamma
        type: log10_float
        bounds: [-3.0, 1.30103]
    isolation_forest:
      - name: contamination
        type: float
        bounds: [0.01, 0.5]
      - name: max_samples
        type: int
        bounds: [64, 2048]
      - name: n_estimators
        type: int
        bounds: [50, 300]
paper_results:
  default:   # Table 8 (without GA, test N=3065)
    xgboost:
      accuracy: 0.975
      precision: 0.97
      recall: 0.98
      f1: 0.975
      auc: 0.97
    svm:
      accuracy: 0.744
      precision: 0.826
      recall: 0.713
      f1: 0.765
      auc: 0.71
    isolation_forest:
      accuracy: 0.694
      precision: 0.732
      recall: 0.683
      f1: 0.707
      auc: 0.53
  ga_params:   # Tables 5-7 (tuned hyperparameters from paper)
    xgboost:   # Table 5
      n_estimators: 79
      gamma: 0.28
      min_child_weight: 1.94
      colsample_bytree: 0.58
      max_depth: 5
      reg_lambda: 0.77
      learning_rate: 0.55
    svm:       # Table 6
      C: 10.92
      gamma: 13.262
    isolation_forest: # Table 7
      contamination: 0.3
      max_samples: 1000
      n_estimators: 89
  ga:          # Table 9 (evaluation metrics after GA tuning, test N=3065)
    xgboost:
      accuracy: 0.992
      precision: 0.992
      recall: 0.993
      f1: 0.992
      auc: 0.99
      mae: 0.01
    svm:
      accuracy: 0.87
      precision: 0.869
      recall: 0.872
      f1: 0.87
      auc: 0.86
      mae: 0.13
    isolation_forest:
      accuracy: 0.824
      precision: 0.824
      recall: 0.827
      f1: 0.825
      auc: 0.79
      mae: 0.18
  table10: # Table 10 (Comparison with existing methods on Ethereum dataset, attributed to other works)
    xgboost_ga:
      method: "Our Proposed Framework"
      algorithm: "XGBoost with GA"
      reference: "El-Attar et al. [ours]"
      accuracy: 0.992
      mae: 0.01
      precision: 0.992
      recall: 0.993
      f1: 0.992
      auc: 0.99
      std_of_accuracy: 0.109
    lof:
      method: "Fangfang et al."
      algorithm: "LOF"
      reference: "[12]"
      accuracy: 0.949
      mae: 0.06
      precision: 0.946
      recall: 0.954
      f1: 0.949
      auc: 0.94
      std_of_accuracy: 0.103
    cart:
      method: "Saxena et al."
      algorithm: "CART"
      reference: "[14]"
      accuracy: 0.810
      mae: 0.22
      precision: 0.813
      recall: 0.810
      f1: 0.809
      auc: 0.81
      std_of_accuracy: 0.035
    xgboost_default:
      method: "Alarab et al."
      algorithm: "XGBoost"
      reference: "[16]"
      accuracy: 0.975
      mae: 0.03
      precision: 0.970
      recall: 0.980
      f1: 0.975
      auc: 0.97
      std_of_accuracy: 0.107


